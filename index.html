<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HEADSGONE — Cork, Ireland</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400&family=Space+Grotesk:wght@300;400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ── CURSOR ── -->
  <div id="cursor"></div>
  <div id="cursor-trail"></div>

  <!-- ── NOISE OVERLAY ── -->
  <canvas id="noise-canvas"></canvas>

  <!-- ── WEBGL CANVAS ── -->
  <canvas id="webgl-canvas"></canvas>

  <!-- ── SINGLE PAGE LAYOUT ── -->
  <main id="main">

    <!-- LEFT: Identity -->
    <div class="identity">
      <div class="identity-tag">
        <span class="dot"></span>
        <span>CORK, IRELAND</span>
      </div>
      <h1 class="identity-title">
        <span class="title-word">HEADS</span><span class="title-word accent">GONE</span>
      </h1>
      <p class="identity-sub">Electronic producer.</p>
    </div>

    <!-- RIGHT: Links stack -->
    <div class="links-panel">

      <div class="links-label">SOCIALS & MUSIC</div>

      <div class="links-stack">

        <a href="https://www.instagram.com/headsgonee" target="_blank" class="link-row" data-index="0">
          <div class="link-left">
            <span class="link-platform">INSTAGRAM</span>
            <span class="link-detail">@HEADSGONEE</span>
          </div>
          <div class="link-right">
            <span class="link-action">FOLLOW</span>
            <svg class="link-arrow" width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M3 9H15M15 9L10 4M15 9L10 14" stroke="currentColor" stroke-width="1.5"/></svg>
          </div>
        </a>

        <a href="https://soundcloud.com/headsgone" target="_blank" class="link-row" data-index="1">
          <div class="link-left">
            <span class="link-platform">SOUNDCLOUD</span>
            <span class="link-detail">@HEADSGONE</span>
          </div>
          <div class="link-right">
            <span class="link-action">LISTEN</span>
            <svg class="link-arrow" width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M3 9H15M15 9L10 4M15 9L10 14" stroke="currentColor" stroke-width="1.5"/></svg>
          </div>
        </a>

        <a href="https://open.spotify.com/artist/headsgone" target="_blank" class="link-row" data-index="2">
          <div class="link-left">
            <span class="link-platform">SPOTIFY</span>
            <span class="link-detail">HEADSGONE</span>
          </div>
          <div class="link-right">
            <span class="link-action">STREAM</span>
            <svg class="link-arrow" width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M3 9H15M15 9L10 4M15 9L10 14" stroke="currentColor" stroke-width="1.5"/></svg>
          </div>
        </a>

        <a href="https://headsgone.bandcamp.com" target="_blank" class="link-row" data-index="3">
          <div class="link-left">
            <span class="link-platform">BANDCAMP</span>
            <span class="link-detail">BUY · DOWNLOAD</span>
          </div>
          <div class="link-right">
            <span class="link-action">OPEN</span>
            <svg class="link-arrow" width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M3 9H15M15 9L10 4M15 9L10 14" stroke="currentColor" stroke-width="1.5"/></svg>
          </div>
        </a>

      </div>

      <div class="links-divider"></div>

      <div class="links-label">LATEST</div>

      <a href="https://soundcloud.com/headsgone" target="_blank" class="release-feature" data-index="3">
        <div class="release-feature-left">
          <span class="release-feature-tag">SINGLE · 2024</span>
          <span class="release-feature-name">WIMME</span>
          <span class="release-feature-tracks">SOUNDCLOUD</span>
        </div>
        <div class="release-feature-right">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M3 10H17M17 10L11 4M17 10L11 16" stroke="currentColor" stroke-width="1.5"/></svg>
        </div>
      </a>

      <div class="links-footer">
        <span class="footer-copy">© 2024 HEADSGONE</span>
        <span class="footer-location">Cork, IE</span>
      </div>

    </div>

  </main>

  <!-- ── TRANSITION VEIL ── -->
  <div id="page-veil"></div>

  <!-- Scripts -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/CustomEase.min.js"></script>
  <script src="main.js"></script>
</body>
</html>
